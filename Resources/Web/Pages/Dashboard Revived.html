      <body>
	<div id="app">
		<v-app>
			<v-main style="overflow:auto">
				<v-sheet id="scrolling" class="overflow-y-auto">
					<v-img src="{{ server }}/dao/image/customer_logo" max-height="50" contain class="mt-2"></v-img>
					<v-text-field ref="article" class="mx-2 mx-md-5" hide-details label="Bauteil" v-model="articleid"
						outlined clearable clear-icon="mdi-close-circle" @keyup.enter="getProductionOrder">
					</v-text-field>
					<v-simple-table class="mx-2 mx-md-6">
						<template v-slot:default>
							<thead>
								<tr>
									<th class="text-left">Property</th>
									<th class="text-left">Valus</th>
								</tr>
							</thead>
							<tbody>
								<tr v-for="(value, propertyName) in productionOrder" :key="propertyName">
									<td>{{ propertyName }}</td>
									<td>{{ value }}</td>
								</tr>
							</tbody>
						</template>
					</v-simple-table>
				</v-sheet>
			</v-main>
		</v-app>
	</div>

	  <script>
		window.vm = new Vue({
        el: "#app",
        vuetify: new Vuetify({
          theme: {
            themes: {
              light: {
                primary: "#001941",
                secondary: "#00A0DC",
                accent: "#00A0DC",
              },
            },
          },
        }),
        created() {
            // ToDo: INstallieren von EventHandlern
          window.eev.on("onLocalScanData", this.handleScanner);
          window.eev.on("onScannerDataReceivedMessage", this.handleNotification);
        },
        mounted() {

          this.focusInput();

          //document.addEventListener('keypress', this.keypressHandler);
        },
        destroyed(){
            // Aufräumen: z.B. EventHandler entfernen, Timer löschen ect.
            console.log("Template-Page destroyed");
            window.eev.off("onLocalScanData", this.handleScanner);
            window.eev.off("onScannerDataReceivedMessage", this.handleNotification);
        },
        data: {
          articleid: "",
          productionOrder: '',
        },

        computed: {
        },

        methods: {
          keypressHandler(e) {
            this.articleid += e.key;
          },

          focusInput() {
            this.$refs.article.focus();
          },

          handleScanner(msg){
               this.articleid = msg;
               this.getProductionOrder();
          },

          handleNotification(msg){
              console.log(msg);
          },

           getProductionOrder: async function () {

            console.log("getProductionOrder");

            try{

            const data = await window.cmesOdata
              .get("ProductionOrders")
              .query({
                $filter: `ProductionItems/any(d:d/Code eq '${this.articleid}')`
                //, $select: "Code, DesiredStartDate"
                // $include: {"Productionst"}
              });
                  console.log("Debug");
                if (data === null || data.length === 0) 
                {
					window.messageservice.add({severity:'error', summary: 'Fehler', detail: `Bauteil ${this.articleid} nicht gefunden.`, life: 5000})
                }
                else
				{
					if(Array.isArray(data))
                    {
						this.productionOrder = data[0];
                        // Umsetzen der Datumsfelder in 'lesbare' Formatierung
                        Object.entries(data[0]).forEach(entry => {
                                    const [key, value] = entry;
                                    if(key.indexOf("Date") != -1 && value != null){
                                        console.log(key, value);
                                        this.productionOrder[key] = window.DateTime.fromISO(value).setLocale('de').toLocaleString(DateTime.DATE_MED_WITH_WEEKDAY);
                                    }
                        });
                        
                    }    
				}
            }
            catch(err){
                console.log(err);
            }
          },
        },
      });

    Die Verwendung des Grids ist sehr variabel:
    -   Entweder kann das Grid via 
                    grid-template-columns: auto auto auto auto auto auto auto auto auto;
                    grid-template-rows: auto;

        und ggf. welche sich daraus ergebenden Felder zusammengeführt werden sollen. 


        - justify-items:start / end / center / stretch              --> positioniert die Items in X-Richtung
        - align-items:start / end / center / stretch                --> positioniert die Items in Y-Richtung
        - justify-content:start / end / center / stretch            --> passt die Position an, wenn die Gridfelder kleiner sind als der Ihnen
                        space-around / space-between /space-evenly.     zugedachte Platz. (z.B. wenn ihre Größe mit width / height festgelegt wurde)
        - justify-self                                              --> kann direkt im Item verwendet werden um es z.B. anders zu platzieren als die
                                                                        restlichen Items: <div class="item" style="justify-self: end;">3</div>
        Der geamte Container kann mit analog positioniert werden.
        - justify-content und align-content:

    All diese Kommandos platzieren nicht den Text / den Inhalt innerhalb des Items

    Um deren Inhalt zu zentrieren kann entweder etwas wie text-align verwendet werden (gibt's aber nur für die X-Achse)

        display: flex; 
        justify-content: center;

    -----------------------------------------------------------*/
